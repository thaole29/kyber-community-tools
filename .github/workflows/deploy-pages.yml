name: Deploy dashboard to GitHub Pages

# Build dashboard/web on every push to main and deploy the static bundle
# (including dashboard/web/public/data/*.json snapshots) to GitHub Pages.
#
# Pre-requisite: enable Pages in repo Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow the workflow to write the Pages artifact + deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys clobbering each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
